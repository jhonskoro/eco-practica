<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>ECO — práctica oral</title>
<style>
@import url('https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@500;700&family=JetBrains+Mono:wght@400;500;700&display=swap');

:root{
  --bg:#171512;
  --bg-raised:#201d19;
  --line:#38332c;
  --amber:#e8a33d;
  --amber-dim:#8a6a2f;
  --green:#7fb069;
  --red:#e85d4e;
  --text:#e9e3d6;
  --text-dim:#a89e8c;
  --text-faint:#6b6357;
}
*{box-sizing:border-box;}
html,body{margin:0;padding:0;}
body{
  background:var(--bg);
  color:var(--text);
  font-family:'JetBrains Mono',monospace;
  min-height:100vh;
  -webkit-font-smoothing:antialiased;
}
.wrap{
  max-width:640px;
  margin:0 auto;
  padding:28px 20px 60px;
}
header{
  display:flex;
  align-items:baseline;
  justify-content:space-between;
  margin-bottom:22px;
  padding-bottom:16px;
  border-bottom:1px solid var(--line);
}
h1{
  font-family:'Space Grotesk',sans-serif;
  font-size:22px;
  font-weight:700;
  letter-spacing:0.5px;
  margin:0;
  color:var(--text);
}
h1 span{color:var(--amber);}
.tabs{display:flex;gap:2px;}
.tab{
  background:none;border:1px solid var(--line);color:var(--text-dim);
  font-family:inherit;font-size:12px;letter-spacing:0.5px;text-transform:uppercase;
  padding:8px 14px;cursor:pointer;border-radius:3px;
}
.tab.active{background:var(--amber);color:#171512;border-color:var(--amber);font-weight:700;}
.view{display:none;}
.view.active{display:block;}

/* --- practicar --- */
.counter{
  font-size:11px;color:var(--text-faint);letter-spacing:1px;text-transform:uppercase;margin-bottom:10px;
}
.card{
  background:var(--bg-raised);
  border:1px solid var(--line);
  border-radius:6px;
  padding:32px 26px;
  margin-bottom:18px;
}
.card-label{font-size:10px;color:var(--amber-dim);letter-spacing:2px;text-transform:uppercase;margin-bottom:12px;}
.card-front{
  font-family:'Space Grotesk',sans-serif;
  font-size:24px;font-weight:500;line-height:1.4;color:var(--text);
}
.mic-row{display:flex;align-items:center;gap:14px;margin:22px 0 6px;}
.mic-btn{
  width:56px;height:56px;border-radius:50%;
  border:2px solid var(--amber);background:transparent;color:var(--amber);
  font-size:20px;cursor:pointer;flex-shrink:0;
  display:flex;align-items:center;justify-content:center;
  transition:all .15s;
}
.mic-btn:hover{background:rgba(232,163,61,0.1);}
.mic-btn.recording{
  background:var(--red);border-color:var(--red);color:#171512;
  animation:pulse 1.1s infinite;
}
@keyframes pulse{
  0%{box-shadow:0 0 0 0 rgba(232,93,78,0.5);}
  70%{box-shadow:0 0 0 14px rgba(232,93,78,0);}
  100%{box-shadow:0 0 0 0 rgba(232,93,78,0);}
}
.mic-status{font-size:12px;color:var(--text-dim);}
.transcript-box{
  min-height:52px;
  padding:14px 16px;
  background:#12100d;
  border:1px dashed var(--line);
  border-radius:4px;
  font-size:15px;line-height:1.7;
  margin-top:14px;
}
.transcript-box.empty{color:var(--text-faint);font-style:italic;}
.w-ok{color:var(--green);}
.w-bad{color:var(--red);text-decoration:underline wavy var(--red);text-underline-offset:3px;}
.w-miss{color:var(--red);opacity:0.7;}
.expected-line{margin-top:10px;font-size:13px;color:var(--text-faint);}
.expected-line b{color:var(--text-dim);font-weight:500;}
.actions{display:flex;gap:10px;margin-top:20px;}
.btn{
  font-family:inherit;font-size:13px;letter-spacing:0.3px;
  padding:10px 16px;border-radius:4px;cursor:pointer;border:1px solid var(--line);
  background:transparent;color:var(--text-dim);
}
.btn:hover{border-color:var(--text-dim);color:var(--text);}
.btn-green{border-color:var(--green);color:var(--green);}
.btn-green:hover{background:rgba(127,176,105,0.12);}
.btn-red{border-color:var(--red);color:var(--red);}
.btn-red:hover{background:rgba(232,93,78,0.12);}
.btn-amber{border-color:var(--amber);color:var(--amber);}
.btn-amber:hover{background:rgba(232,163,61,0.12);}
.warn{
  font-size:12px;color:var(--text-faint);margin-top:16px;line-height:1.6;
  border-top:1px solid var(--line);padding-top:14px;
}
.empty-state{
  text-align:center;padding:60px 20px;color:var(--text-dim);
}

/* --- mazo --- */
.deck-item{
  background:var(--bg-raised);border:1px solid var(--line);border-radius:5px;
  padding:14px 16px;margin-bottom:10px;
}
.deck-item .front{font-family:'Space Grotesk',sans-serif;font-size:15px;margin-bottom:4px;}
.deck-item .back{font-size:12px;color:var(--text-dim);}
.deck-item .meta{font-size:10px;color:var(--text-faint);margin-top:8px;letter-spacing:0.5px;text-transform:uppercase;}
.deck-item .row-actions{display:flex;gap:8px;margin-top:10px;}
.small-btn{
  font-family:inherit;font-size:11px;padding:5px 10px;border-radius:3px;cursor:pointer;
  border:1px solid var(--line);background:none;color:var(--text-faint);
}
.small-btn:hover{color:var(--red);border-color:var(--red);}
.add-form{
  background:var(--bg-raised);border:1px solid var(--line);border-radius:6px;
  padding:18px;margin-bottom:20px;
}
.add-form label{display:block;font-size:11px;color:var(--text-faint);letter-spacing:1px;text-transform:uppercase;margin-bottom:6px;}
.add-form textarea, .add-form input{
  width:100%;background:#12100d;border:1px solid var(--line);border-radius:4px;
  color:var(--text);font-family:inherit;font-size:14px;padding:10px 12px;margin-bottom:14px;resize:vertical;
}
.add-form textarea{min-height:60px;}
.section-title{font-size:11px;color:var(--amber-dim);letter-spacing:2px;text-transform:uppercase;margin:24px 0 10px;}
</style>
</head>
<body>
<div class="wrap">
  <header>
    <h1>EC<span>O</span></h1>
    <div class="tabs">
      <button class="tab active" data-tab="practicar">Practicar</button>
      <button class="tab" data-tab="mazo">Mazo</button>
    </div>
  </header>

  <div id="view-practicar" class="view active">
    <div class="counter" id="counter"></div>
    <div id="practica-area"></div>
    <div class="warn">El reconocimiento de voz usa el motor del navegador (anda mejor en Chrome). Puede marcar como error alguna palabra que dijiste bien si la transcripción no fue perfecta — no es infalible.</div>
  </div>

  <div id="view-mazo" class="view">
    <div class="add-form">
      <label>Frente (lo que ves)</label>
      <textarea id="in-front" placeholder="Ej: How do you say 'sin embargo' in English?"></textarea>
      <label>Respuesta esperada (lo que tenés que decir en voz alta)</label>
      <textarea id="in-back" placeholder="Ej: However"></textarea>
      <button class="btn btn-amber" id="btn-add">+ Agregar tarjeta</button>
    </div>
    <div class="section-title">Tarjetas en el mazo</div>
    <div id="deck-list"></div>
  </div>
</div>

<script>
const STORAGE_KEY = 'eco-deck-v1';
let deck = [];
let current = null;
let recognizing = false;
let recognizer = null;
let lastResult = null; // {words:[{w,status}]}

const EXAMPLE_DECK = [
  {id:'ex1', front:"Decí en voz alta: «El que persevera, alcanza.»", back:"El que persevera alcanza", box:0, seen:0},
  {id:'ex2', front:"How do you say 'sin embargo' in English?", back:"However", box:0, seen:0},
  {id:'ex3', front:"Recitá: los días de la semana en inglés, de corrido.", back:"Monday Tuesday Wednesday Thursday Friday Saturday Sunday", box:0, seen:0},
];

function normWord(w){
  return w.toLowerCase()
    .normalize('NFD').replace(/[\u0300-\u036f]/g,'') // saca tildes
    .replace(/[^\wáéíóúñ]/gi,'')
    .trim();
}

async function loadDeck(){
  try{
    const res = await window.storage.get('deck', false);
    if(res && res.value){
      deck = JSON.parse(res.value);
      return;
    }
  }catch(e){ /* no existe todavía */ }
  deck = EXAMPLE_DECK.slice();
  await saveDeck();
}

async function saveDeck(){
  try{
    await window.storage.set('deck', JSON.stringify(deck), false);
  }catch(e){ console.error('no se pudo guardar', e); }
}

function weightedRandomCard(){
  if(deck.length===0) return null;
  // boxes más bajos (menos sabidas) pesan más
  const weights = deck.map(c => 6 - Math.min(c.box||0,5));
  const total = weights.reduce((a,b)=>a+b,0);
  let r = Math.random()*total;
  for(let i=0;i<deck.length;i++){
    r -= weights[i];
    if(r<=0) return deck[i];
  }
  return deck[deck.length-1];
}

function renderCounter(){
  const el = document.getElementById('counter');
  el.textContent = deck.length ? `${deck.length} tarjeta${deck.length===1?'':'s'} en el mazo` : '';
}

function renderPractica(){
  const area = document.getElementById('practica-area');
  if(deck.length===0){
    area.innerHTML = `<div class="empty-state">No hay tarjetas todavía.<br>Andá a la pestaña «Mazo» y agregá la primera.</div>`;
    return;
  }
  if(!current) current = weightedRandomCard();
  lastResult = null;

  area.innerHTML = `
    <div class="card">
      <div class="card-label">Frente</div>
      <div class="card-front">${escapeHtml(current.front)}</div>
      <div class="mic-row">
        <button class="mic-btn" id="btn-mic">●</button>
        <div class="mic-status" id="mic-status">Tocá para grabar tu respuesta</div>
      </div>
      <div class="transcript-box empty" id="transcript">Tu transcripción va a aparecer acá</div>
      <div class="expected-line" id="expected-line" style="display:none"></div>
      <div class="actions" id="actions"></div>
    </div>
  `;
  document.getElementById('btn-mic').addEventListener('click', toggleRecording);
}

function escapeHtml(s){
  return s.replace(/[&<>"]/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
}

function toggleRecording(){
  const SpeechRecognition = window.SpeechRecognition || window.webkitSpeechRecognition;
  if(!SpeechRecognition){
    document.getElementById('mic-status').textContent = 'Este navegador no soporta reconocimiento de voz. Probá en Chrome de escritorio o Android.';
    return;
  }
  if(recognizing){
    recognizer.stop();
    return;
  }
  recognizer = new SpeechRecognition();
  recognizer.lang = 'es-AR';
  recognizer.interimResults = false;
  recognizer.maxAlternatives = 1;

  const micBtn = document.getElementById('btn-mic');
  const status = document.getElementById('mic-status');

  recognizer.onstart = () => {
    recognizing = true;
    micBtn.classList.add('recording');
    status.textContent = 'Escuchando... tocá de nuevo para cortar';
  };
  recognizer.onerror = (e) => {
    status.textContent = 'Error al escuchar (' + e.error + '). Probá de nuevo.';
  };
  recognizer.onend = () => {
    recognizing = false;
    micBtn.classList.remove('recording');
  };
  recognizer.onresult = (e) => {
    const said = e.results[0][0].transcript;
    status.textContent = 'Listo. Comparando...';
    evaluate(said);
  };
  recognizer.start();
}

// diff simple por LCS a nivel palabra, sobre versiones normalizadas
function diffWords(saidArr, expectedArr){
  const n = saidArr.length, m = expectedArr.length;
  const dp = Array.from({length:n+1},()=>new Array(m+1).fill(0));
  for(let i=1;i<=n;i++){
    for(let j=1;j<=m;j++){
      if(normWord(saidArr[i-1])===normWord(expectedArr[j-1]) && normWord(saidArr[i-1])!=='')
        dp[i][j] = dp[i-1][j-1]+1;
      else
        dp[i][j] = Math.max(dp[i-1][j], dp[i][j-1]);
    }
  }
  // backtrack para marcar cuáles de "expected" fueron dichas (match) y cuáles no
  let i=n,j=m;
  const expectedStatus = new Array(m).fill('miss'); // por defecto no dicha
  while(i>0 && j>0){
    if(normWord(saidArr[i-1])===normWord(expectedArr[j-1]) && normWord(saidArr[i-1])!==''){
      expectedStatus[j-1] = 'ok';
      i--;j--;
    } else if(dp[i-1][j] >= dp[i][j-1]){
      i--;
    } else {
      j--;
    }
  }
  return expectedStatus;
}

function evaluate(saidText){
  const saidArr = saidText.split(/\s+/).filter(Boolean);
  const expectedArr = current.back.split(/\s+/).filter(Boolean);
  const statuses = diffWords(saidArr, expectedArr);
  const allOk = statuses.every(s => s==='ok');

  lastResult = {allOk};

  const tBox = document.getElementById('transcript');
  tBox.classList.remove('empty');
  tBox.innerHTML = escapeHtml(saidText);

  const expLine = document.getElementById('expected-line');
  expLine.style.display = 'block';
  expLine.innerHTML = '<b>Esperado:</b> ' + expectedArr.map((w,idx)=>{
    const cls = statuses[idx]==='ok' ? 'w-ok' : 'w-bad';
    return `<span class="${cls}">${escapeHtml(w)}</span>`;
  }).join(' ');

  const actions = document.getElementById('actions');
  if(allOk){
    actions.innerHTML = `<span style="color:var(--green);font-size:13px;">✓ Perfecto, coincide.</span>
      <button class="btn btn-green" id="btn-next">Siguiente →</button>`;
    document.getElementById('btn-next').addEventListener('click', ()=>nextCard(true));
  } else {
    actions.innerHTML = `
      <button class="btn" id="btn-retry">Reintentar</button>
      <button class="btn btn-red" id="btn-fail">No lo sabía → siguiente</button>
      <button class="btn btn-amber" id="btn-force-ok">Igual estaba bien</button>
    `;
    document.getElementById('btn-retry').addEventListener('click', ()=>{
      document.getElementById('mic-status').textContent = 'Tocá para grabar de nuevo';
      renderRetryOnly();
    });
    document.getElementById('btn-fail').addEventListener('click', ()=>nextCard(false));
    document.getElementById('btn-force-ok').addEventListener('click', ()=>nextCard(true));
  }
}

function renderRetryOnly(){
  document.getElementById('transcript').className='transcript-box empty';
  document.getElementById('transcript').textContent='Tu transcripción va a aparecer acá';
  document.getElementById('expected-line').style.display='none';
  document.getElementById('actions').innerHTML='';
}

async function nextCard(gotIt){
  const idx = deck.findIndex(c=>c.id===current.id);
  if(idx>-1){
    deck[idx].seen = (deck[idx].seen||0)+1;
    deck[idx].box = gotIt ? Math.min((deck[idx].box||0)+1, 5) : 0;
    await saveDeck();
  }
  current = weightedRandomCard();
  renderPractica();
}

function renderDeckList(){
  const list = document.getElementById('deck-list');
  if(deck.length===0){
    list.innerHTML = `<div class="empty-state">Todavía no agregaste tarjetas.</div>`;
    return;
  }
  list.innerHTML = deck.map(c => `
    <div class="deck-item">
      <div class="front">${escapeHtml(c.front)}</div>
      <div class="back">→ ${escapeHtml(c.back)}</div>
      <div class="meta">Caja ${c.box||0}/5 · vista ${c.seen||0} ${c.seen===1?'vez':'veces'}</div>
      <div class="row-actions">
        <button class="small-btn" data-del="${c.id}">Eliminar</button>
      </div>
    </div>
  `).join('');
  list.querySelectorAll('[data-del]').forEach(btn=>{
    btn.addEventListener('click', async (e)=>{
      const id = e.target.getAttribute('data-del');
      deck = deck.filter(c=>c.id!==id);
      await saveDeck();
      renderDeckList();
      renderCounter();
      if(current && current.id===id){ current=null; }
    });
  });
}

document.getElementById('btn-add').addEventListener('click', async ()=>{
  const front = document.getElementById('in-front').value.trim();
  const back = document.getElementById('in-back').value.trim();
  if(!front || !back) return;
  deck.push({id:'c'+Date.now(), front, back, box:0, seen:0});
  document.getElementById('in-front').value='';
  document.getElementById('in-back').value='';
  await saveDeck();
  renderDeckList();
  renderCounter();
});

document.querySelectorAll('.tab').forEach(tab=>{
  tab.addEventListener('click', ()=>{
    document.querySelectorAll('.tab').forEach(t=>t.classList.remove('active'));
    document.querySelectorAll('.view').forEach(v=>v.classList.remove('active'));
    tab.classList.add('active');
    document.getElementById('view-'+tab.dataset.tab).classList.add('active');
    if(tab.dataset.tab==='mazo') renderDeckList();
  });
});

(async function init(){
  await loadDeck();
  renderCounter();
  renderPractica();
  renderDeckList();
})();
</script>
</body>
</html>
